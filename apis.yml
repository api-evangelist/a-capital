name: A Capital
description: >-
  A.Capital Ventures is an early-stage venture capital firm founded by Ronny
  Conway, a former partner at Andreessen Horowitz (a16z) and one of the first
  employees at Google Ventures. The firm provides funding, talent, and strategic
  counsel to founders building at the frontier of technology, with a portfolio
  spanning AI and machine learning (OpenAI, Anthropic, Hugging Face,
  Character.ai), developer tools (Notion, Replit, Databricks), and crypto and
  consumer platforms (Coinbase, Uniswap, Reddit, Airbnb). A.Capital differs from
  standard venture models by customizing investment amounts rather than
  enforcing ownership thresholds, advising without mandatory board seats, and
  staffing full-time Talent Partners to help early-stage teams hire and build
  their organizational foundation. This profile was surfaced via the a16z
  network (through founder Ronny Conway's a16z tenure) and enriched from the
  firm's public website. A.Capital is a venture capital firm and does not
  publish a developer-facing API surface, developer portal, or API artifacts.
